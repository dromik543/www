<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Countdown</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #000;
    color: #fff;
    font-family: "Inter", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* jemné světlo uprostřed */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,0.055) 0%,
            rgba(255,255,255,0.018) 25%,
            transparent 60%
        );
    pointer-events: none;
}

/* film grain */
body::after {
    content: "";
    position: fixed;
    inset: -50%;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    transform: rotate(10deg);
}

.container {
    width: 100%;
    max-width: 1500px;
    padding: 40px;
    text-align: center;
    position: relative;
    z-index: 2;
}

/* horní text */

.title {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    opacity: 0.45;
    margin-bottom: 65px;
}

/* countdown */

.countdown {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(12px, 2.5vw, 45px);
}

.unit {
    min-width: 130px;
}

.number {
    font-size: clamp(65px, 10vw, 155px);
    font-weight: 300;
    line-height: 0.85;
    letter-spacing: -0.065em;

    font-variant-numeric: tabular-nums;

    transition:
        opacity 0.18s ease,
        transform 0.18s ease;
}

.number.changed {
    opacity: 0;
    transform: translateY(8px);
}

.label {
    margin-top: 28px;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    opacity: 0.28;
}

.separator {
    font-size: clamp(40px, 6vw, 85px);
    font-weight: 200;
    opacity: 0.18;
    line-height: 0.8;
    margin-top: -3px;
}

/* datum */

.date {
    margin-top: 75px;

    font-size: 11px;
    letter-spacing: 0.65em;
    opacity: 0.32;
}

/* sound button */

.sound {
    position: fixed;
    right: 28px;
    bottom: 25px;

    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(0,0,0,0.4);

    color: rgba(255,255,255,0.55);

    padding: 11px 15px;

    font-family: inherit;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;

    cursor: pointer;

    transition:
        border-color 0.2s ease,
        color 0.2s ease,
        background 0.2s ease;
}

.sound:hover {
    border-color: rgba(255,255,255,0.4);
    color: #fff;
    background: rgba(255,255,255,0.05);
}

.sound.active {
    color: #fff;
    border-color: rgba(255,255,255,0.45);
}

/* menší obrazovky */

@media (max-width: 850px) {

    .container {
        padding: 20px;
    }

    .title {
        margin-bottom: 45px;
    }

    .countdown {
        gap: 8px;
    }

    .unit {
        min-width: 0;
        flex: 1;
    }

    .number {
        font-size: clamp(38px, 10vw, 80px);
    }

    .separator {
        font-size: clamp(25px, 5vw, 50px);
    }

    .label {
        margin-top: 20px;
        font-size: 7px;
        letter-spacing: 0.25em;
    }

    .date {
        margin-top: 55px;
        font-size: 8px;
    }
}

@media (max-width: 520px) {

    .title {
        font-size: 8px;
        letter-spacing: 0.3em;
    }

    .number {
        font-size: 31px;
    }

    .separator {
        font-size: 20px;
    }

    .label {
        font-size: 6px;
    }

    .date {
        font-size: 7px;
    }

    .sound {
        right: 15px;
        bottom: 15px;
        padding: 9px 11px;
        font-size: 7px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        The countdown begins
    </div>

    <div class="countdown">

        <div class="unit">
            <div class="number" id="months">00</div>
            <div class="label">Months</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <div class="number" id="days">00</div>
            <div class="label">Days</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <div class="number" id="hours">00</div>
            <div class="label">Hours</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <div class="number" id="minutes">00</div>
            <div class="label">Minutes</div>
        </div>

        <div class="separator">:</div>

        <div class="unit">
            <div class="number" id="seconds">00</div>
            <div class="label">Seconds</div>
        </div>

    </div>

    <div class="date">
        15 · 08 · 2027
    </div>

</div>

<button class="sound" id="soundButton">
    Sound off
</button>


<!--
    Skutečná nahrávka mechanického hodinového tikání.
    Zdroj: Wikimedia Commons
    Public domain
-->
<audio
    id="clockSound"
    preload="auto"
    crossorigin="anonymous"
    src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Clock_ticking.ogg">
</audio>


<script>

/* =========================================
   NASTAVENÍ
========================================= */

const targetDate = new Date("2027-08-15T00:00:00");


/* =========================================
   ELEMENTY
========================================= */

const monthsEl = document.getElementById("months");
const daysEl = document.getElementById("days");
const hoursEl = document.getElementById("hours");
const minutesEl = document.getElementById("minutes");
const secondsEl = document.getElementById("seconds");

const soundButton = document.getElementById("soundButton");
const clockSound = document.getElementById("clockSound");


/* =========================================
   ZVUK
========================================= */

let soundEnabled = false;

let audioContext = null;
let audioSource = null;
let audioGain = null;


/*
    Vytvoření Web Audio systému.

    Díky tomu můžeme u velkých změn
    udělat tiknutí hlubší a hlasitější.
*/

function setupAudio() {

    if (audioContext) return;

    audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    audioSource = audioContext.createMediaElementSource(clockSound);

    audioGain = audioContext.createGain();

    audioGain.gain.value = 0;

    audioSource.connect(audioGain);
    audioGain.connect(audioContext.destination);
}


/*
    Zapnutí / vypnutí zvuku
*/

soundButton.addEventListener("click", async () => {

    setupAudio();

    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }

    soundEnabled = !soundEnabled;

    if (soundEnabled) {

        soundButton.textContent = "Sound on";
        soundButton.classList.add("active");

        audioGain.gain.value = 0.55;

    } else {

        soundButton.textContent = "Sound off";
        soundButton.classList.remove("active");

        audioGain.gain.value = 0;
    }
});


/*
    Skutečné mechanické tiknutí.

    Čím větší jednotka se změnila,
    tím je zvuk hlubší a hlasitější.
*/

function mechanicalTick(type) {

    if (!soundEnabled) return;

    setupAudio();

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    /*
        Každý typ změny má vlastní charakter.
    */

    let volume = 0.55;
    let speed = 1;

    if (type === "seconds") {

        volume = 0.42;
        speed = 1.00;

    } else if (type === "minutes") {

        volume = 0.58;
        speed = 0.92;

    } else if (type === "hours") {

        volume = 0.72;
        speed = 0.84;

    } else if (type === "days") {

        volume = 0.86;
        speed = 0.76;

    } else if (type === "months") {

        volume = 1.00;
        speed = 0.67;
    }

    /*
        Krátké ztlumení před každým tiknutím,
        aby se zvuky nepřekrývaly.
    */

    audioGain.gain.cancelScheduledValues(audioContext.currentTime);

    audioGain.gain.setValueAtTime(
        0,
        audioContext.currentTime
    );

    audioGain.gain.linearRampToValueAtTime(
        volume,
        audioContext.currentTime + 0.015
    );

    audioGain.gain.linearRampToValueAtTime(
        0,
        audioContext.currentTime + 0.42
    );

    /*
        Použijeme vždy začátek skutečné
        nahrávky mechanických hodin.
    */

    clockSound.pause();

    try {
        clockSound.currentTime = 0;
    } catch (e) {}

    clockSound.playbackRate = speed;

    clockSound.play().catch(() => {});
}


/* =========================================
   ANIMACE ČÍSEL
========================================= */

function animateNumber(element, value) {

    const newValue = String(value).padStart(2, "0");

    if (element.textContent === newValue) {
        return false;
    }

    element.classList.add("changed");

    setTimeout(() => {

        element.textContent = newValue;

        element.classList.remove("changed");

    }, 90);

    return true;
}


/* =========================================
   VÝPOČET MĚSÍCŮ
========================================= */

function getDifference(now, target) {

    let months = 0;

    let tempDate = new Date(now);

    /*
        Přidáváme celé měsíce,
        dokud se nedostaneme před cílové datum.
    */

    while (true) {

        let nextDate = new Date(tempDate);

        nextDate.setMonth(
            nextDate.getMonth() + 1
        );

        if (nextDate <= target) {

            tempDate = nextDate;
            months++;

        } else {

            break;
        }
    }


    /*
        Zbytek převedeme na dny,
        hodiny, minuty a sekundy.
    */

    let remaining =
        target.getTime() -
        tempDate.getTime();


    const dayMs =
        1000 * 60 * 60 * 24;

    const hourMs =
        1000 * 60 * 60;

    const minuteMs =
        1000 * 60;

    const secondMs =
        1000;


    const days =
        Math.floor(remaining / dayMs);

    remaining -= days * dayMs;


    const hours =
        Math.floor(remaining / hourMs);

    remaining -= hours * hourMs;


    const minutes =
        Math.floor(remaining / minuteMs);

    remaining -= minutes * minuteMs;


    const seconds =
        Math.floor(remaining / secondMs);


    return {
        months,
        days,
        hours,
        minutes,
        seconds
    };
}


/* =========================================
   POSLEDNÍ HODNOTY
========================================= */

let previous = {
    months: null,
    days: null,
    hours: null,
    minutes: null,
    seconds: null
};


/* =========================================
   HLAVNÍ COUNTDOWN
========================================= */

function updateCountdown() {

    const now = new Date();

    /*
        Pokud už countdown skončil
    */

    if (now >= targetDate) {

        monthsEl.textContent = "00";
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";

        return;
    }


    const time =
        getDifference(now, targetDate);


    /*
        Změna měsíců
    */

    if (
        previous.months !== null &&
        previous.months !== time.months
    ) {

        animateNumber(
            monthsEl,
            time.months
        );

        mechanicalTick("months");

    } else {

        monthsEl.textContent =
            String(time.months).padStart(2, "0");
    }


    /*
        Změna dnů
    */

    if (
        previous.days !== null &&
        previous.days !== time.days
    ) {

        animateNumber(
            daysEl,
            time.days
        );

        mechanicalTick("days");

    } else {

        daysEl.textContent =
            String(time.days).padStart(2, "0");
    }


    /*
        Změna hodin
    */

    if (
        previous.hours !== null &&
        previous.hours !== time.hours
    ) {

        animateNumber(
            hoursEl,
            time.hours
        );

        mechanicalTick("hours");

    } else {

        hoursEl.textContent =
            String(time.hours).padStart(2, "0");
    }


    /*
        Změna minut
    */

    if (
        previous.minutes !== null &&
        previous.minutes !== time.minutes
    ) {

        animateNumber(
            minutesEl,
            time.minutes
        );

        mechanicalTick("minutes");

    } else {

        minutesEl.textContent =
            String(time.minutes).padStart(2, "0");
    }


    /*
        Změna sekund

        Normálně tikne každou sekundu.
    */

    if (
        previous.seconds !== null &&
        previous.seconds !== time.seconds
    ) {

        animateNumber(
            secondsEl,
            time.seconds
        );

        mechanicalTick("seconds");

    } else {

        secondsEl.textContent =
            String(time.seconds).padStart(2, "0");
    }


    /*
        Uložení současných hodnot
    */

    previous = {
        months: time.months,
        days: time.days,
        hours: time.hours,
        minutes: time.minutes,
        seconds: time.seconds
    };
}


/* =========================================
   SPUŠTĚNÍ
========================================= */

updateCountdown();

setInterval(
    updateCountdown,
    250
);

</script>

</body>
</html>
