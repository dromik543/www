<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Countdown</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #000;
    color: #fff;
    font-family: "Inter", sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* jemná záře */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,0.055) 0%,
            rgba(255,255,255,0.018) 25%,
            transparent 60%
        );

    pointer-events: none;
}

/* film grain */

body::after {
    content: "";
    position: fixed;
    inset: -50%;

    pointer-events: none;

    opacity: 0.035;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");

    transform: rotate(10deg);
}

.container {
    width: 100%;
    max-width: 1500px;

    padding: 40px;

    text-align: center;

    position: relative;
    z-index: 2;
}

/* horní text */

.title {
    font-size: 13px;
    font-weight: 400;

    letter-spacing: 0.45em;
    text-transform: uppercase;

    opacity: 0.45;

    margin-bottom: 65px;
}

/* countdown */

.countdown {
    display: flex;

    align-items: flex-start;
    justify-content: center;

    gap: clamp(12px, 2.5vw, 45px);
}

.unit {
    min-width: 130px;
}

.number {
    font-size: clamp(65px, 10vw, 155px);

    font-weight: 300;

    line-height: 0.85;

    letter-spacing: -0.065em;

    font-variant-numeric: tabular-nums;

    transition:
        opacity 0.18s ease,
        transform 0.18s ease;
}

.number.changed {
    opacity: 0;

    transform:
        translateY(8px);
}

.label {
    margin-top: 28px;

    font-size: 10px;
    font-weight: 400;

    letter-spacing: 0.42em;

    text-transform: uppercase;

    opacity: 0.28;
}

.separator {
    font-size: clamp(40px, 6vw, 85px);

    font-weight: 200;

    opacity: 0.18;

    line-height: 0.8;

    margin-top: -3px;
}

/* datum */

.date {
    margin-top: 75px;

    font-size: 11px;

    letter-spacing: 0.65em;

    opacity: 0.32;
}

/* tlačítko zvuku */

.sound {
    position: fixed;

    right: 28px;
    bottom: 25px;

    border:
        1px solid rgba(255,255,255,0.16);

    background:
        rgba(0,0,0,0.4);

    color:
        rgba(255,255,255,0.55);

    padding: 11px 15px;

    font-family: inherit;

    font-size: 9px;

    letter-spacing: 0.25em;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        border-color 0.2s ease,
        color 0.2s ease,
        background 0.2s ease;
}

.sound:hover {
    border-color:
        rgba(255,255,255,0.4);

    color: #fff;

    background:
        rgba(255,255,255,0.05);
}

.sound.active {
    color: #fff;

    border-color:
        rgba(255,255,255,0.45);
}


/* ==========================================
   TABLET / MOBIL
========================================== */

@media (max-width: 850px) {

    .container {
        padding: 20px;
    }

    .title {
        margin-bottom: 45px;
    }

    .countdown {
        gap: 8px;
    }

    .unit {
        min-width: 0;
        flex: 1;
    }

    .number {
        font-size:
            clamp(38px, 10vw, 80px);
    }

    .separator {
        font-size:
            clamp(25px, 5vw, 50px);
    }

    .label {
        margin-top: 20px;

        font-size: 7px;

        letter-spacing: 0.25em;
    }

    .date {
        margin-top: 55px;

        font-size: 8px;
    }
}

@media (max-width: 520px) {

    .title {
        font-size: 8px;

        letter-spacing: 0.3em;
    }

    .number {
        font-size: 31px;
    }

    .separator {
        font-size: 20px;
    }

    .label {
        font-size: 6px;
    }

    .date {
        font-size: 7px;
    }

    .sound {
        right: 15px;
        bottom: 15px;

        padding: 9px 11px;

        font-size: 7px;
    }
}

</style>
</head>


<body>


<div class="container">

    <div class="title">
        The countdown begins
    </div>


    <div class="countdown">

        <div class="unit">

            <div
                class="number"
                id="months">
                00
            </div>

            <div class="label">
                Months
            </div>

        </div>


        <div class="separator">
            :
        </div>


        <div class="unit">

            <div
                class="number"
                id="days">
                00
            </div>

            <div class="label">
                Days
            </div>

        </div>


        <div class="separator">
            :
        </div>


        <div class="unit">

            <div
                class="number"
                id="hours">
                00
            </div>

            <div class="label">
                Hours
            </div>

        </div>


        <div class="separator">
            :
        </div>


        <div class="unit">

            <div
                class="number"
                id="minutes">
                00
            </div>

            <div class="label">
                Minutes
            </div>

        </div>


        <div class="separator">
            :
        </div>


        <div class="unit">

            <div
                class="number"
                id="seconds">
                00
            </div>

            <div class="label">
                Seconds
            </div>

        </div>

    </div>


    <div class="date">
        15 · 08 · 2027
    </div>

</div>


<button
    class="sound"
    id="soundButton">

    Sound off

</button>


<!--
=================================================
SKUTEČNÉ MECHANICKÉ HODINY
=================================================

Nahrávka:
Mechanical Clock Movement Ticking

CC0 / public domain.

Zvuk se používá jako skutečná nahrávka,
ne jako synteticky vytvořený zvuk.
=================================================
-->

<audio
    id="clock"
    preload="auto"
    crossorigin="anonymous">

    <source
        src="https://freesound.org/data/previews/346/346166_598795-lq.mp3"
        type="audio/mpeg">

</audio>


<script>


/* ==========================================
   CÍLOVÉ DATUM
========================================== */

const targetDate =
    new Date("2027-08-15T00:00:00");


/* ==========================================
   ELEMENTY
========================================== */

const monthsEl =
    document.getElementById("months");

const daysEl =
    document.getElementById("days");

const hoursEl =
    document.getElementById("hours");

const minutesEl =
    document.getElementById("minutes");

const secondsEl =
    document.getElementById("seconds");

const soundButton =
    document.getElementById("soundButton");

const clock =
    document.getElementById("clock");


/* ==========================================
   ZVUK
========================================== */

let soundEnabled = false;

let audioContext = null;

let source = null;

let gainNode = null;


/*
    Web Audio se vytvoří až po kliknutí,
    protože Chrome blokuje automatický zvuk.
*/

function createAudio() {

    if (audioContext) {
        return;
    }

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    source =
        audioContext.createMediaElementSource(
            clock
        );


    gainNode =
        audioContext.createGain();


    gainNode.gain.value = 0;


    source.connect(gainNode);

    gainNode.connect(
        audioContext.destination
    );
}


/* ==========================================
   TLAČÍTKO SOUND
========================================== */

soundButton.addEventListener(
    "click",
    async function () {

        createAudio();


        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();

        }


        soundEnabled =
            !soundEnabled;


        if (soundEnabled) {

            soundButton.textContent =
                "Sound on";

            soundButton.classList.add(
                "active"
            );


            /*
                Začneme přehrávat skutečné
                mechanické tikání.
            */

            clock.loop = true;

            clock.volume = 1;

            clock.playbackRate = 1;


            await clock.play();


            gainNode.gain.setTargetAtTime(
                0.65,
                audioContext.currentTime,
                0.03
            );

        }

        else {

            soundButton.textContent =
                "Sound off";

            soundButton.classList.remove(
                "active"
            );


            gainNode.gain.setTargetAtTime(
                0,
                audioContext.currentTime,
                0.03
            );

        }

    }
);


/* ==========================================
   MECHANICKÝ ÚDER
========================================== */

function mechanicalTick(type) {

    if (!soundEnabled) {
        return;
    }


    /*
        Zvuk necháme běžet jako skutečné
        tikání hodin.

        Při změně větší jednotky
        krátce zvýšíme hlasitost
        a snížíme rychlost.
    */

    let volume = 0.65;

    let speed = 1;


    if (type === "seconds") {

        volume = 0.62;
        speed = 1.00;

    }


    if (type === "minutes") {

        volume = 0.76;
        speed = 0.94;

    }


    if (type === "hours") {

        volume = 0.88;
        speed = 0.87;

    }


    if (type === "days") {

        volume = 1.05;
        speed = 0.79;

    }


    if (type === "months") {

        volume = 1.20;
        speed = 0.70;

    }


    clock.playbackRate = speed;


    const now =
        audioContext.currentTime;


    /*
        krátký výraznější úder
    */

    gainNode.gain.cancelScheduledValues(
        now
    );


    gainNode.gain.setValueAtTime(
        0,
        now
    );


    gainNode.gain.linearRampToValueAtTime(
        Math.min(volume, 1),
        now + 0.015
    );


    gainNode.gain.linearRampToValueAtTime(
        0.65,
        now + 0.20
    );

}


/* ==========================================
   ANIMACE ČÍSEL
========================================== */

function animateNumber(
    element,
    value
) {

    const formatted =
        String(value).padStart(2, "0");


    if (
        element.textContent ===
        formatted
    ) {

        return;

    }


    element.classList.add(
        "changed"
    );


    setTimeout(
        function () {

            element.textContent =
                formatted;

            element.classList.remove(
                "changed"
            );

        },
        90
    );

}


/* ==========================================
   VÝPOČET
========================================== */

function getDifference(
    now,
    target
) {

    let months = 0;

    let temp =
        new Date(now);


    /*
        Spočítáme celé kalendářní měsíce.
    */

    while (true) {

        const next =
            new Date(temp);


        next.setMonth(
            next.getMonth() + 1
        );


        if (next <= target) {

            temp = next;

            months++;

        }

        else {

            break;

        }

    }


    let remaining =
        target.getTime() -
        temp.getTime();


    const day =
        1000 *
        60 *
        60 *
        24;


    const hour =
        1000 *
        60 *
        60;


    const minute =
        1000 *
        60;


    const second =
        1000;


    const days =
        Math.floor(
            remaining / day
        );


    remaining -=
        days * day;


    const hours =
        Math.floor(
            remaining / hour
        );


    remaining -=
        hours * hour;


    const minutes =
        Math.floor(
            remaining / minute
        );


    remaining -=
        minutes * minute;


    const seconds =
        Math.floor(
            remaining / second
        );


    return {

        months,
        days,
        hours,
        minutes,
        seconds

    };

}


/* ==========================================
   PŘEDCHOZÍ HODNOTY
========================================== */

let previous = {

    months: null,

    days: null,

    hours: null,

    minutes: null,

    seconds: null

};


/* ==========================================
   COUNTDOWN
========================================== */

function updateCountdown() {

    const now =
        new Date();


    /*
        Countdown skončil.
    */

    if (now >= targetDate) {

        monthsEl.textContent = "00";

        daysEl.textContent = "00";

        hoursEl.textContent = "00";

        minutesEl.textContent = "00";

        secondsEl.textContent = "00";

        return;

    }


    const time =
        getDifference(
            now,
            targetDate
        );


    /* =========================
       MONTHS
    ========================= */

    if (
        previous.months !== null &&
        previous.months !==
        time.months
    ) {

        animateNumber(
            monthsEl,
            time.months
        );

        mechanicalTick(
            "months"
        );

    }

    else {

        monthsEl.textContent =
            String(
                time.months
            ).padStart(2, "0");

    }


    /* =========================
       DAYS
    ========================= */

    if (
        previous.days !== null &&
        previous.days !==
        time.days
    ) {

        animateNumber(
            daysEl,
            time.days
        );

        mechanicalTick(
            "days"
        );

    }

    else {

        daysEl.textContent =
            String(
                time.days
            ).padStart(2, "0");

    }


    /* =========================
       HOURS
    ========================= */

    if (
        previous.hours !== null &&
        previous.hours !==
        time.hours
    ) {

        animateNumber(
            hoursEl,
            time.hours
        );

        mechanicalTick(
            "hours"
        );

    }

    else {

        hoursEl.textContent =
            String(
                time.hours
            ).padStart(2, "0");

    }


    /* =========================
       MINUTES
    ========================= */

    if (
        previous.minutes !== null &&
        previous.minutes !==
        time.minutes
    ) {

        animateNumber(
            minutesEl,
            time.minutes
        );

        mechanicalTick(
            "minutes"
        );

    }

    else {

        minutesEl.textContent =
            String(
                time.minutes
            ).padStart(2, "0");

    }


    /* =========================
       SECONDS
    ========================= */

    if (
        previous.seconds !== null &&
        previous.seconds !==
        time.seconds
    ) {

        animateNumber(
            secondsEl,
            time.seconds
        );

        mechanicalTick(
            "seconds"
        );

    }

    else {

        secondsEl.textContent =
            String(
                time.seconds
            ).padStart(2, "0");

    }


    /* =========================
       ULOŽENÍ
    ========================= */

    previous = {

        months: time.months,

        days: time.days,

        hours: time.hours,

        minutes: time.minutes,

        seconds: time.seconds

    };

}


/* ==========================================
   SPUŠTĚNÍ
========================================== */

updateCountdown();


setInterval(
    updateCountdown,
    250
);

</script>

</body>
</html>
