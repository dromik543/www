
<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Countdown</title>


    <!-- =========================================
         FONT
         ========================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
          rel="stylesheet">


    <style>

        /* =========================================
           ZÁKLAD
           ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;

            color: white;

            font-family: "Inter", sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        /* =========================================
           JEMNÁ ZÁŘE UPROSTŘED
           ========================================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background:

                radial-gradient(
                    circle at center,
                    rgba(255,255,255,0.035),
                    transparent 55%
                );

            pointer-events: none;

        }


        /* =========================================
           HLAVNÍ KONTEJNER
           ========================================= */

        .container {

            width: 96%;

            max-width: 1600px;

            text-align: center;

        }


        /* =========================================
           NADPIS
           ========================================= */

        .title {

            font-size: 12px;

            font-weight: 400;

            letter-spacing: 9px;

            text-transform: uppercase;

            color: rgba(255,255,255,0.4);

            margin-bottom: 48px;

        }


        /* =========================================
           COUNTDOWN
           ========================================= */

        .countdown {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: clamp(8px, 1.8vw, 32px);

        }


        /* =========================================
           JEDNOTKA
           ========================================= */

        .unit {

            display: flex;

            flex-direction: column;

            align-items: center;

            min-width: clamp(65px, 12vw, 190px);

        }


        /* =========================================
           ČÍSLA
           ========================================= */

        .number {

            font-size: clamp(45px, 9vw, 130px);

            font-weight: 300;

            line-height: 0.95;

            letter-spacing: -5px;

            font-variant-numeric: tabular-nums;

        }


        /* =========================================
           ANIMACE PŘI ZMĚNĚ
           ========================================= */

        .number.change {

            animation: changeNumber 0.22s ease;

        }


        @keyframes changeNumber {

            0% {

                opacity: 0.25;

                transform: translateY(-5px);

            }

            100% {

                opacity: 1;

                transform: translateY(0);

            }

        }


        /* =========================================
           NÁZVY
           ========================================= */

        .label {

            margin-top: 20px;

            font-size: clamp(8px, 0.9vw, 12px);

            font-weight: 400;

            letter-spacing: 4px;

            text-transform: uppercase;

            color: rgba(255,255,255,0.32);

        }


        /* =========================================
           DVOJTEČKY
           ========================================= */

        .separator {

            font-size: clamp(30px, 5vw, 70px);

            font-weight: 200;

            color: rgba(255,255,255,0.18);

            margin-bottom: 28px;

        }


        /* =========================================
           DATUM
           ========================================= */

        .date {

            margin-top: 60px;

            font-size: 10px;

            letter-spacing: 6px;

            color: rgba(255,255,255,0.22);

            text-transform: uppercase;

        }


        /* =========================================
           TLAČÍTKO ZVUKU
           ========================================= */

        #soundButton {

            position: fixed;

            right: 30px;

            bottom: 30px;

            width: 42px;

            height: 42px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.2);

            background: rgba(255,255,255,0.03);

            color: rgba(255,255,255,0.55);

            cursor: pointer;

            font-size: 15px;

            transition: 0.2s;

        }


        #soundButton:hover {

            background: rgba(255,255,255,0.1);

            border-color: rgba(255,255,255,0.45);

            color: white;

        }


        /* =========================================
           FILMOVÝ GRAIN
           ========================================= */

        .grain {

            position: fixed;

            inset: -50%;

            pointer-events: none;

            opacity: 0.025;

            background-image:

                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.7'/%3E%3C/svg%3E");

            animation: grainMove 0.2s steps(2) infinite;

        }


        @keyframes grainMove {

            0% {
                transform: translate(0,0);
            }

            25% {
                transform: translate(2%,-2%);
            }

            50% {
                transform: translate(-2%,2%);
            }

            75% {
                transform: translate(2%,2%);
            }

            100% {
                transform: translate(-2%,-2%);
            }

        }


        /* =========================================
           MOBIL
           ========================================= */

        @media (max-width: 700px) {

            .countdown {

                gap: 4px;

            }


            .number {

                font-size: 11vw;

                letter-spacing: -2px;

            }


            .unit {

                min-width: 17vw;

            }


            .label {

                font-size: 6px;

                letter-spacing: 2px;

                margin-top: 12px;

            }


            .separator {

                font-size: 8vw;

                margin-bottom: 18px;

            }


            .title {

                font-size: 8px;

                letter-spacing: 5px;

                margin-bottom: 35px;

            }


            .date {

                margin-top: 45px;

                font-size: 8px;

                letter-spacing: 3px;

            }

        }

    </style>

</head>


<body>


    <!-- FILMOVÝ GRAIN -->

    <div class="grain"></div>


    <!-- =========================================
         HLAVNÍ OBSAH
         ========================================= -->

    <main class="container">


        <div class="title">

            The countdown begins

        </div>


        <div class="countdown">


            <!-- MĚSÍCE -->

            <div class="unit">

                <div
                    class="number"
                    id="months">

                    00

                </div>

                <div class="label">

                    Months

                </div>

            </div>


            <div class="separator">

                :

            </div>


            <!-- DNY -->

            <div class="unit">

                <div
                    class="number"
                    id="days">

                    00

                </div>

                <div class="label">

                    Days

                </div>

            </div>


            <div class="separator">

                :

            </div>


            <!-- HODINY -->

            <div class="unit">

                <div
                    class="number"
                    id="hours">

                    00

                </div>

                <div class="label">

                    Hours

                </div>

            </div>


            <div class="separator">

                :

            </div>


            <!-- MINUTY -->

            <div class="unit">

                <div
                    class="number"
                    id="minutes">

                    00

                </div>

                <div class="label">

                    Minutes

                </div>

            </div>


            <div class="separator">

                :

            </div>


            <!-- SEKUNDY -->

            <div class="unit">

                <div
                    class="number"
                    id="seconds">

                    00

                </div>

                <div class="label">

                    Seconds

                </div>

            </div>


        </div>


        <!-- DATUM -->

        <div class="date">

            15 · 08 · 2027

        </div>


    </main>


    <!-- =========================================
         SOUND BUTTON
         ========================================= -->

    <button
        id="soundButton"
        title="Zapnout / vypnout zvuk">

        🔇

    </button>


    <script>


        /* =========================================
           CÍLOVÉ DATUM
           ========================================= */

        const targetDate =

            new Date(
                "2027-08-15T00:00:00"
            );


        /* =========================================
           ELEMENTY
           ========================================= */

        const monthsElement =
            document.getElementById("months");

        const daysElement =
            document.getElementById("days");

        const hoursElement =
            document.getElementById("hours");

        const minutesElement =
            document.getElementById("minutes");

        const secondsElement =
            document.getElementById("seconds");

        const soundButton =
            document.getElementById("soundButton");


        /* =========================================
           AUDIO
           ========================================= */

        let soundEnabled = false;

        let audioContext = null;


        function createAudio() {

            if (!audioContext) {

                audioContext = new (

                    window.AudioContext ||
                    window.webkitAudioContext

                )();

            }


            if (
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();

            }

        }


        /* =========================================
           MECHANICKÉ TIKNUTÍ
           =========================================

           Toto je hlavní zvuk.

           Není to elektronické pípnutí.

           Používá krátký impulz,
           který připomíná úder
           mechanismu mechanických hodin.

        ========================================= */


        function clockTick(
            strength,
            pitch,
            length
        ) {


            if (!soundEnabled)
                return;


            createAudio();


            const ctx =
                audioContext;


            const now =
                ctx.currentTime;


            /* -------------------------------------
               HLAVNÍ ÚDER
               ------------------------------------- */

            const oscillator =
                ctx.createOscillator();


            const gain =
                ctx.createGain();


            oscillator.type =
                "triangle";


            oscillator.frequency.setValueAtTime(
                pitch,
                now
            );


            /*
             * Velmi rychlý náběh
             * vytvoří charakteristický
             * mechanický úder.
             */

            gain.gain.setValueAtTime(
                0.0001,
                now
            );


            gain.gain.exponentialRampToValueAtTime(
                strength,
                now + 0.002
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                now + length
            );


            oscillator.connect(gain);


            gain.connect(
                ctx.destination
            );


            oscillator.start(now);


            oscillator.stop(
                now + length
            );


            /* -------------------------------------
               VELMI KRÁTKÉ "CVAKNUTÍ"
               ------------------------------------- */

            const click =
                ctx.createOscillator();


            const clickGain =
                ctx.createGain();


            click.type =
                "square";


            click.frequency.setValueAtTime(
                pitch * 2.2,
                now
            );


            clickGain.gain.setValueAtTime(
                strength * 0.35,
                now
            );


            clickGain.gain.exponentialRampToValueAtTime(
                0.0001,
                now + 0.018
            );


            click.connect(
                clickGain
            );


            clickGain.connect(
                ctx.destination
            );


            click.start(now);


            click.stop(
                now + 0.02
            );

        }


        /* =========================================
           SEKUNDA
           ========================================= */

        function secondTick() {

            clockTick(

                0.055,

                1250,

                0.055

            );

        }


        /* =========================================
           MINUTA
           ========================================= */

        function minuteTick() {

            clockTick(

                0.11,

                850,

                0.075

            );

        }


        /* =========================================
           HODINA
           ========================================= */

        function hourTick() {

            clockTick(

                0.17,

                620,

                0.10

            );

        }


        /* =========================================
           DEN
           ========================================= */

        function dayTick() {

            clockTick(

                0.25,

                430,

                0.15

            );

        }


        /* =========================================
           MĚSÍC
           ========================================= */

        function monthTick() {

            clockTick(

                0.36,

                300,

                0.22

            );

        }


        /* =========================================
           ZAPNUTÍ ZVUKU
           ========================================= */

        soundButton.addEventListener(
            "click",
            function() {


                soundEnabled =
                    !soundEnabled;


                if (soundEnabled) {


                    createAudio();


                    soundButton.textContent =
                        "🔊";


                    /*
                     * Testovací mechanické tiknutí
                     */

                    clockTick(
                        0.11,
                        850,
                        0.075
                    );


                } else {


                    soundButton.textContent =
                        "🔇";

                }

            }
        );


        /* =========================================
           DOPLNĚNÍ NULY
           ========================================= */

        function twoDigits(number) {

            return String(number)
                .padStart(2, "0");

        }


        /* =========================================
           ANIMACE
           ========================================= */

        function animate(element) {


            element.classList.remove(
                "change"
            );


            void element.offsetWidth;


            element.classList.add(
                "change"
            );

        }


        /* =========================================
           PŘEDCHOZÍ HODNOTY
           ========================================= */

        let previous = {

            months: null,

            days: null,

            hours: null,

            minutes: null,

            seconds: null

        };


        /* =========================================
           COUNTDOWN
           ========================================= */

        function updateCountdown() {


            const now =
                new Date();


            let difference =
                targetDate - now;


            /* -------------------------------------
               KONEC ODPOČTU
               ------------------------------------- */

            if (difference <= 0) {


                monthsElement.textContent =
                    "00";

                daysElement.textContent =
                    "00";

                hoursElement.textContent =
                    "00";

                minutesElement.textContent =
                    "00";

                secondsElement.textContent =
                    "00";


                return;

            }


            /* -------------------------------------
               MĚSÍCE
               ------------------------------------- */

            let months = 0;


            let tempDate =
                new Date(now);


            while (true) {


                const nextMonth =
                    new Date(tempDate);


                nextMonth.setMonth(
                    nextMonth.getMonth() + 1
                );


                if (
                    nextMonth <= targetDate
                ) {


                    months++;


                    tempDate =
                        nextMonth;


                } else {


                    break;

                }

            }


            /* -------------------------------------
               ZBYTEK
               ------------------------------------- */

            let remaining =
                targetDate - tempDate;


            const days =
                Math.floor(

                    remaining /
                    (
                        1000 *
                        60 *
                        60 *
                        24
                    )

                );


            remaining -=

                days *
                (
                    1000 *
                    60 *
                    60 *
                    24
                );


            const hours =
                Math.floor(

                    remaining /
                    (
                        1000 *
                        60 *
                        60
                    )

                );


            remaining -=

                hours *
                (
                    1000 *
                    60 *
                    60
                );


            const minutes =
                Math.floor(

                    remaining /
                    (
                        1000 *
                        60
                    )

                );


            remaining -=

                minutes *
                (
                    1000 *
                    60
                );


            const seconds =
                Math.floor(

                    remaining /
                    1000

                );


            /* -------------------------------------
               HODNOTY
               ------------------------------------- */

            const values = {


                months:
                    twoDigits(months),


                days:
                    twoDigits(days),


                hours:
                    twoDigits(hours),


                minutes:
                    twoDigits(minutes),


                seconds:
                    twoDigits(seconds)

            };


            /* -------------------------------------
               ZOBRAZENÍ
               ------------------------------------- */

            monthsElement.textContent =
                values.months;


            daysElement.textContent =
                values.days;


            hoursElement.textContent =
                values.hours;


            minutesElement.textContent =
                values.minutes;


            secondsElement.textContent =
                values.seconds;


            /* -------------------------------------
               SEKUNDA
               ------------------------------------- */

            if (

                previous.seconds !== null &&

                previous.seconds !==
                values.seconds

            ) {


                animate(
                    secondsElement
                );


                secondTick();

            }


            /* -------------------------------------
               MINUTA
               ------------------------------------- */

            if (

                previous.minutes !== null &&

                previous.minutes !==
                values.minutes

            ) {


                animate(
                    minutesElement
                );


                minuteTick();

            }


            /* -------------------------------------
               HODINA
               ------------------------------------- */

            if (

                previous.hours !== null &&

                previous.hours !==
                values.hours

            ) {


                animate(
                    hoursElement
                );


                hourTick();

            }


            /* -------------------------------------
               DEN
               ------------------------------------- */

            if (

                previous.days !== null &&

                previous.days !==
                values.days

            ) {


                animate(
                    daysElement
                );


                dayTick();

            }


            /* -------------------------------------
               MĚSÍC
               ------------------------------------- */

            if (

                previous.months !== null &&

                previous.months !==
                values.months

            ) {


                animate(
                    monthsElement
                );


                monthTick();

            }


            /* -------------------------------------
               ULOŽENÍ
               ------------------------------------- */

            previous =
                values;

        }


        /* =========================================
           SPUŠTĚNÍ
           ========================================= */

        updateCountdown();


        setInterval(

            updateCountdown,

            250

        );

    </script>


</body>

</html>
